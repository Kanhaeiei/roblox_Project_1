[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shadow-army-contracts"
version = "0.1.0"
description = "Contract and deterministic validators for Shadow Army Rebirth build artifacts"
requires-python = ">=3.11"
dependencies = ["jsonschema>=4.20,<5"]

[project.optional-dependencies]
ai = ["openai>=1.66,<3"]

[project.scripts]
shadow-validate = "validation.cli:main"
shadow-assemble = "manifest.cli:main"
shadow-bridge-dry-run = "studio_bridge.cli:main"
shadow-bridge-control = "studio_bridge.control_cli:main"
shadow-orchestrate = "orchestrator.cli:main"
shadow-agent-run = "agent_runner.cli:main"

[tool.setuptools]
packages = ["validation", "manifest", "studio_bridge", "orchestrator", "agent_runner"]
